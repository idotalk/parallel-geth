name: Parallel Execution Benchmark

on:
  pull_request:
    branches:
      - master

jobs:
  benchmark:
    name: Run Parallel Benchmarks - Real Blocks
    runs-on: ubuntu-latest
    permissions:
      contents: write # Results will be pushed back to the PR
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Run benchmark
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          # The benchmark outputs results to BENCHMARK_OUTPUT_FILE
          export BENCHMARK_OUTPUT_FILE_REAL_BLOCKS=$GITHUB_WORKSPACE/benchmarks/results/real_blocks_benchmark.txt
          export BENCHMARK_JSON_INPUT_DIR=$GITHUB_WORKSPACE/benchmarks/blocks/blocksdata
          go test -v ./benchmarks -run TestParallelBenchmarkAgainstRealBlocks

      - name: Commit benchmark results
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update parallel execution benchmark results"
          file_pattern: "benchmarks/results/real_blocks_benchmark.txt"
